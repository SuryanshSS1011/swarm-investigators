[project]
name = "swarm-investigators"
version = "0.1.0"
description = "LLM investigators auditing synthetic multi-agent message boards for planted violations (48-hour AI safety sprint, November 2026)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.2",
    "openai>=3.37",
    "python-dotenv>=1.0",
    "pytest>=8",
]

[project.optional-dependencies]
modal = ["modal>=1.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
